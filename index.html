<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Actualiza la página automáticamente cada 5 segundos -->
    <meta http-equiv="refresh" content="5">
    <title>Comandos Básicos de Teclado</title>
    
    <style>
        /* Estilos CSS tradicionales sin Flexbox ni Grid para compatibilidad con Android 4 */
        body {
            font-family: sans-serif, Arial, Helvetica;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #1e1e1e;
            border: 1px solid #333333;
            padding: 15px;
            border-radius: 8px;
        }

        h1 {
            color: #4da6ff;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .info {
            background-color: #2a2a2a;
            color: #888888;
            font-size: 12px;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        /* Tabla clásica para asegurar alineación perfecta en navegadores viejos */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            text-align: left;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #333333;
            font-size: 14px;
        }

        th {
            background-color: #252525;
            color: #4da6ff;
        }

        .key {
            background-color: #333333;
            color: #00ffcc;
            font-family: monospace;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            display: inline-block;
        }

        .gif-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #252525;
            border-radius: 6px;
        }

        .gif-box img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .footer {
            margin-top: 15px;
            font-size: 11px;
            color: #666666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Atajos de Teclado Básicos</h1>
        
        <div class="info">
            Página optimizada • Autorecarga cada 5s
        </div>

        <table>
            <thead>
                <tr>
                    <th>Comando</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="key">Ctrl + C</span></td>
                    <td>Copiar</td>
                </tr>
                <tr>
                    <td><span class="key">Ctrl + V</span></td>
                    <td>Pegar</td>
                </tr>
                <tr>
                    <td><span class="key">Ctrl + X</span></td>
                    <td>Cortar</td>
                </tr>
                <tr>
                    <td><span class="key">Ctrl + Z</span></td>
                    <td>Deshacer</td>
                </tr>
                <tr>
                    <td><span class="key">Ctrl + Y</span></td>
                    <td>Rehacer</td>
                </tr>
                <tr>
                    <td><span class="key">Ctrl + A</span></td>
                    <td>Seleccionar todo</td>
                </tr>
                <tr>
                    <td><span class="key">Ctrl + S</span></td>
                    <td>Guardar</td>
                </tr>
                <tr>
                    <td><span class="key">Ctrl + F</span></td>
                    <td>Buscar</td>
                </tr>
            </tbody>
        </table>

        <div class="gif-box">
            <img src="https://media.giphy.com/media/13Hgw8T855C208/giphy.gif" alt="Gato escribiendo" width="250" height="180">
        </div>

        <div class="footer">
            Diseñado para navegadores antiguos en Android
        </div>
    </div>

</body>
</html>
